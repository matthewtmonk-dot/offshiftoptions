name: Technical Preparation Worker

on:
  # No `schedule:` trigger for now - deliberately temporary (see PROJECT_HANDOFF.md's readiness-
  # mismatch investigation). The prior evening-after-close schedule (21:10-23:55 UTC) is now known
  # to be too early (real Sep 8 evidence: the provider had not yet posted the just-closed
  # session's own daily candle). The endpoint's own isTechnicalPreparationWindowOpen was corrected
  # to the right morning-before-open semantics, but the REAL time the provider reliably publishes
  # that candle each morning has not been measured yet - that is exactly what the new
  # latest-candle-freshness diagnostic (Scanner Engineering Diagnostics page) exists to answer.
  # Until Matt has that evidence, technical preparation runs ONLY via workflow_dispatch (manual) or
  # a direct authenticated call to the endpoint - never automatically. A follow-up slice restores a
  # real, evidence-backed `schedule:` once the provider's actual publish time is known.
  workflow_dispatch:

# One bounded cycle claims real TechnicalPreparationItem rows via the existing DB claim mechanism
# before it finishes - cancelling an in-flight run rather than letting it complete would abandon
# those claims until the existing stale-claim timeout recovers them. If GitHub delays a scheduled
# run, queue the next one rather than killing the current one; the DB claim system is still the
# final concurrency protection either way.
concurrency:
  group: technical-preparation-worker
  cancel-in-progress: false

jobs:
  process-technical-preparation:
    runs-on: ubuntu-latest

    steps:
      - name: Run one bounded technical preparation cycle
        env:
          CRON_SECRET: ${{ secrets.OSO_CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 300 \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://offshiftoptions.com/api/internal/scanner-technical/process
