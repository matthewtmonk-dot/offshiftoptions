name: Technical Preparation Worker

on:
  schedule:
    # Broad UTC container for the real 5:45-9:15 AM America/New_York window across both EDT and
    # EST. NYSE market-day, holiday, DST, and exact local-time acceptance stay server-side in
    # isTechnicalPreparationWindowOpen; a UTC tick outside that local window is a safe no-op.
    - cron: "45-59/5 9 * * 1-5"
    - cron: "*/5 10-13 * * 1-5"
    - cron: "0-15/5 14 * * 1-5"
  workflow_dispatch:

# A job may run up to two bounded cycles sequentially. Each server cycle is still independently
# capped by the existing worker limits (<=125 history symbols, history concurrency 4); this only
# makes each irregular GitHub wake-up more useful. Cancelling an in-flight run rather than letting
# it complete would abandon claimed rows until stale-claim recovery, so delayed scheduled runs queue
# instead of killing the active job. The DB claim system is still the final concurrency protection.
concurrency:
  group: technical-preparation-worker
  cancel-in-progress: false

jobs:
  process-technical-preparation:
    runs-on: ubuntu-latest

    steps:
      - name: Run up to two bounded technical preparation cycles
        env:
          CRON_SECRET: ${{ secrets.OSO_CRON_SECRET }}
        run: |
          set -euo pipefail

          ENDPOINT="https://offshiftoptions.com/api/internal/scanner-technical/process"
          CONNECT_TIMEOUT_SECONDS=20
          TOTAL_TIMEOUT_SECONDS=90

          run_cycle() {
            local cycle="$1"
            local response_file
            response_file="$(mktemp)"

            echo "Technical preparation cycle ${cycle}"
            curl --fail-with-body --silent --show-error \
              --connect-timeout "${CONNECT_TIMEOUT_SECONDS}" \
              --max-time "${TOTAL_TIMEOUT_SECONDS}" \
              -X POST \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -o "${response_file}" \
              "${ENDPOINT}"

            cat "${response_file}"
            echo
            CYCLE_RESPONSE="$(cat "${response_file}")"
            rm -f "${response_file}"
          }

          should_run_second_cycle() {
            CYCLE_RESPONSE_JSON="${CYCLE_RESPONSE}" python3 - <<'PY'
          import json
          import os
          import sys

          try:
              payload = json.loads(os.environ["CYCLE_RESPONSE_JSON"])
          except Exception:
              print("no")
              sys.exit(0)

          should_continue = (
              payload.get("status") == "OK"
              and payload.get("generationStatus") == "IN_PROGRESS"
              and isinstance(payload.get("remainingEligibleCount"), int)
              and payload["remainingEligibleCount"] > 0
          )
          print("yes" if should_continue else "no")
          PY
          }

          run_cycle 1
          if [ "$(should_run_second_cycle)" = "yes" ]; then
            run_cycle 2
          else
            echo "No second technical preparation cycle needed."
          fi
