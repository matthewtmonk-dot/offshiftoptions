name: Technical Preparation Worker

on:
  schedule:
    # Weekday morning: broad UTC container for the real 5:45-9:15 AM America/New_York window
    # across both EDT and EST. NYSE market-day, holiday, DST, and exact local-time acceptance
    # stay server-side in isTechnicalPreparationWindowOpen; a UTC tick outside that local window
    # is a safe no-op.
    - cron: "45-59/5 9 * * 1-5"
    - cron: "*/5 10-13 * * 1-5"
    - cron: "0-15/5 14 * * 1-5"
    # Saturday catch-up: broad UTC container for the real 5:45 AM-12:00 PM America/New_York
    # window (EDT 09:45-16:00 UTC through EST 10:45-17:00 UTC) - see PROJECT_HANDOFF.md's
    # weekend-coverage investigation and isTechnicalPreparationWindowOpen's own doc comment.
    # Wider than the weekday window (no market open to race against, and no known publish time
    # for Friday's overnight candle) but still bounded, not all-day. Sunday deliberately has no
    # trigger of its own - a successful Saturday run's snapshots are already fresh all through
    # Sunday and Monday premarket under the live scan's own freshness check.
    - cron: "45-59/5 9 * * 6"
    - cron: "*/5 10-16 * * 6"
    - cron: "0 17 * * 6"
  workflow_dispatch:

# A job may run up to two bounded cycles sequentially. Each server cycle is still independently
# capped by the existing worker limits (<=125 history symbols, history concurrency 4); this only
# makes each irregular GitHub wake-up more useful. Cancelling an in-flight run rather than letting
# it complete would abandon claimed rows until stale-claim recovery, so delayed scheduled runs queue
# instead of killing the active job. The DB claim system is still the final concurrency protection.
concurrency:
  group: technical-preparation-worker
  cancel-in-progress: false

jobs:
  process-technical-preparation:
    runs-on: ubuntu-latest

    steps:
      - name: Run up to two bounded technical preparation cycles
        env:
          CRON_SECRET: ${{ secrets.OSO_CRON_SECRET }}
        run: |
          set -euo pipefail

          ENDPOINT="https://offshiftoptions.com/api/internal/scanner-technical/process"
          CONNECT_TIMEOUT_SECONDS=20
          TOTAL_TIMEOUT_SECONDS=90
          MAX_RESPONSE_BODY_BYTES=4096

          run_cycle() {
            local cycle="$1"
            local response_file
            local curl_exit
            local http_status
            response_file="$(mktemp)"

            echo "Technical preparation cycle ${cycle}"
            # Keep curl's HTTP failure exit code, but collect its bounded, redacted response
            # before returning nonzero. Never print request headers or environment values.
            set +e
            http_status="$(curl --fail-with-body --silent --show-error \
              --connect-timeout "${CONNECT_TIMEOUT_SECONDS}" \
              --max-time "${TOTAL_TIMEOUT_SECONDS}" \
              -X POST \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -o "${response_file}" \
              -w "%{http_code}" \
              "${ENDPOINT}")"
            curl_exit=$?
            set -e

            echo "HTTP_STATUS=${http_status:-000}"
            echo "CURL_EXIT=${curl_exit}"
            echo "RESPONSE_BODY_BEGIN"
            CRON_SECRET="${CRON_SECRET}" RESPONSE_FILE="${response_file}" MAX_RESPONSE_BODY_BYTES="${MAX_RESPONSE_BODY_BYTES}" python3 - <<'PY'
          import os
          import re

          limit = int(os.environ["MAX_RESPONSE_BODY_BYTES"])
          with open(os.environ["RESPONSE_FILE"], "rb") as response_file:
              body = response_file.read(limit + 1)
          truncated = len(body) > limit
          text = body[:limit].decode("utf-8", errors="replace")
          secret = os.environ["CRON_SECRET"]
          if secret:
              text = text.replace(secret, "[REDACTED]")
          text = re.sub(r"(?im)^(authorization\s*:\s*).*?$", r"\1[REDACTED]", text)
          text = re.sub(r"(?i)\bbearer\s+[A-Za-z0-9._~+/=-]{6,}", "Bearer [REDACTED]", text)
          text = re.sub(
              r'''(?i)(["']?(?:access[_ -]?token|refresh[_ -]?token|api[_ -]?key|secret|password|client[_ -]?secret)["']?\s*[:=]\s*["']?)[^\s"'<>&,}]+''',
              r"\1[REDACTED]",
              text,
          )
          text = re.sub(r"(?i)([?&](?:token|secret|api_key|password)=)[^&\s]+", r"\1[REDACTED]", text)
          text = re.sub(r"\b[A-Za-z0-9_-]{32,}\b", "[REDACTED_TOKEN]", text)
          text = re.sub(r"(?m)^::", ": :", text)
          print(text)
          if truncated:
              print("[RESPONSE_BODY_TRUNCATED]")
          PY
            echo "RESPONSE_BODY_END"

            if [ "${curl_exit}" -ne 0 ]; then
              rm -f "${response_file}"
              return "${curl_exit}"
            fi

            CYCLE_RESPONSE="$(cat "${response_file}")"
            rm -f "${response_file}"
          }

          should_run_second_cycle() {
            CYCLE_RESPONSE_JSON="${CYCLE_RESPONSE}" python3 - <<'PY'
          import json
          import os
          import sys

          try:
              payload = json.loads(os.environ["CYCLE_RESPONSE_JSON"])
          except Exception:
              print("no")
              sys.exit(0)

          should_continue = (
              payload.get("status") == "OK"
              and payload.get("generationStatus") == "IN_PROGRESS"
              and isinstance(payload.get("remainingEligibleCount"), int)
              and payload["remainingEligibleCount"] > 0
          )
          print("yes" if should_continue else "no")
          PY
          }

          run_cycle 1
          if [ "$(should_run_second_cycle)" = "yes" ]; then
            run_cycle 2
          else
            echo "No second technical preparation cycle needed."
          fi
